name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: pass
          POSTGRES_DB: xgamefi
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U user -d xgamefi"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/xgamefi
      SHADOW_DATABASE_URL: postgresql://user:pass@localhost:5432/xgamefi_shadow
      REDIS_URL: redis://localhost:6379

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Load test env
        # .env for vitest.setup/prisma.config; $GITHUB_ENV so `next build` sees
        # the fail-fast env vars in process.env.
        run: |
          cp .env.test .env
          cat .env.test >> "$GITHUB_ENV"

      - name: Create shadow database
        run: PGPASSWORD=pass createdb -h localhost -U user xgamefi_shadow

      - name: Prisma generate
        run: pnpm db:generate

      - name: Prisma migrate deploy
        run: pnpm --filter @xgamefi/db exec prisma migrate deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm -r --if-present build

      - name: Test
        run: pnpm test

      - name: Prisma drift check
        run: pnpm --filter @xgamefi/db db:diff

      - name: Audit (fail on high/critical)
        run: pnpm audit --audit-level high

      - name: Seed demo data (CI only)
        run: pnpm --filter @xgamefi/db db:seed

      - name: Install Playwright browsers
        run: pnpm --filter @xgamefi/web exec playwright install --with-deps chromium

      - name: Demo e2e (headline gate)
        run: pnpm --filter @xgamefi/web exec playwright test e2e/demo.spec.ts
