name: PR to develop — build & test

on:
  pull_request:
    branches: [develop]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10 }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Load test env
        # .env for vitest.setup; $GITHUB_ENV so `next build` sees the fail-fast
        # env vars in process.env across subsequent steps.
        run: |
          cp .env.test .env
          cat .env.test >> "$GITHUB_ENV"

      - name: Prisma generate
        run: pnpm db:generate

      - name: Build
        run: pnpm -r --if-present build

      - name: Test
        run: pnpm test
