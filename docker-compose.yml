services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass
      POSTGRES_DB: xgamefi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d xgamefi"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  createbuckets:
    image: minio/mc
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "until (mc alias set local http://minio:9000 minioadmin minioadmin) do sleep 1; done;
      mc mb -p local/xgamefi; mc anonymous set download local/xgamefi; exit 0;"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrate
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://user:pass@postgres:5432/xgamefi
      SHADOW_DATABASE_URL: postgresql://user:pass@postgres:5432/xgamefi_shadow
    depends_on:
      postgres:
        condition: service_healthy

  seed:
    build:
      context: .
      dockerfile: Dockerfile
      target: seed
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://user:pass@postgres:5432/xgamefi
      SHADOW_DATABASE_URL: postgresql://user:pass@postgres:5432/xgamefi_shadow
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      # The seed creates the demo studio's webhook URL; it must point to the
      # web service name so the worker can deliver webhooks cross-container.
      APP_BASE_URL: http://web:3000
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: web
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://user:pass@postgres:5432/xgamefi
      SHADOW_DATABASE_URL: postgresql://user:pass@postgres:5432/xgamefi_shadow
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      HOSTNAME: 0.0.0.0
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      createbuckets:
        condition: service_completed_successfully

  worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://user:pass@postgres:5432/xgamefi
      SHADOW_DATABASE_URL: postgresql://user:pass@postgres:5432/xgamefi_shadow
      REDIS_URL: redis://redis:6379
      # Webhook deliveries originate from the worker container, so the demo
      # studio's APP_BASE_URL-based webhook URL must resolve to the web service.
      APP_BASE_URL: http://web:3000
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

volumes:
  pgdata: {}
  minio: {}
